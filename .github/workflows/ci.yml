name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --locked
      - name: Verify Python selection
        run: >-
          uv run python -c 'import os, sys; expected = tuple(map(int,
          os.environ["UV_PYTHON"].split("."))); assert sys.version_info[:2] == expected,
          (sys.version, expected)'
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest tests/test_skill_contract.py tests/test_plugin_contract.py -q
      - run: uv run pytest -q

  macos-capsule:
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.14"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --locked
      - name: Verify Python selection
        run: >-
          uv run python -c 'import os, sys; expected = tuple(map(int,
          os.environ["UV_PYTHON"].split("."))); assert sys.version_info[:2] == expected,
          (sys.version, expected)'
      - run: uv run pytest tests/capsule/test_posix.py tests/capsule/test_filesystem.py tests/capsule/test_prepare.py tests/capsule/test_verify_prepared.py tests/capsule/test_cli_plan.py tests/test_cli.py -q
